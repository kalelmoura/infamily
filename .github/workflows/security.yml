name: Security and build checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: https://api.example.com
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_WHATSAPP_NUMBER: "5500000000000"
      OWNER_USER_ID: 00000000-0000-4000-8000-000000000000
      STORE_ADDRESS: CI placeholder address
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/infamily
      ENVIRONMENT: production
      FRONTEND_ORIGIN: https://example.com
      OWNER_USER_ID: 00000000-0000-4000-8000-000000000000
      SUPABASE_JWKS_URL: https://example.supabase.co/auth/v1/.well-known/jwks.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip_audit -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m pytest -q
